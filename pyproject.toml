[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-mlx"
version = "0.1.0"
description = "Standalone LoRA/QLoRA experiments on MLX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mlx>=0.8.0",
  "transformers",
  "numpy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
